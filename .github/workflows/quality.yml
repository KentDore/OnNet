name: Vérifications

on:
  pull_request:
  push:
    branches: [main, migration/publicodes-urssaf]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Installer Playwright
        run: |
          npm install --no-save --no-package-lock --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=120000 playwright@1.55.1 eslint@10.15.0 stylelint@18.0.0 esbuild@0.28.2
          # Les dépendances runtime sont fournies par l'image Ubuntu du runner ; éviter apt-get et ses miroirs réseau.
          npx --no-install playwright install chromium
      - name: Générer les fichiers HTML depuis les sources
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node scripts/build.js "$VERSION" "$RUNNER_TEMP/Onnet-$VERSION.html"
          cp "$RUNNER_TEMP/Onnet-$VERSION.html" index.html
          cp "$RUNNER_TEMP/Onnet-$VERSION.html" "Onnet-$VERSION.html"
      - name: Publier le HTML généré pour mise à jour de la PR
        uses: actions/upload-artifact@v7
        with:
          name: onnet-generated-html
          path: |
            index.html
            Onnet-*.html
          retention-days: 1
      - name: Vérifier la syntaxe JavaScript
        run: |
          node --check src/urssaf-api-client.mjs
          node --check src/ui-utils.mjs
          node --check src/app/00-state-and-calculations.js
          node --check src/app/10-persistence.js
          node --check src/app/20-sharing.js
          node --check src/app/30-rendering.js
          node --check src/app/40-household-and-navigation.js
          node --check src/app/50-input-events.js
          node --check src/app/60-notifications-and-modals.js
          node --check src/app/70-optional-tools-and-startup.js
          node --check scripts/build.js
      - name: Contrôler la qualité JavaScript et CSS
        run: npm run lint
      # Le build synthétique reste hors du dépôt : les tests de calcul doivent lire l'artefact livré.
      - name: Construire le HTML autonome
        run: node scripts/build.js 999.999.999 "$RUNNER_TEMP/Onnet-999.999.999.html"
      - name: Tester le client API Urssaf (moteur de production)
        run: npm run test:urssaf-api
      - name: Tester le modèle Publicodes (diagnostics uniquement)
        run: npm run test:publicodes
      - name: Tester les anciens scénarios locaux (non utilisés en production)
        run: node --test test/calc.test.js
      - name: Tester les utilitaires de présentation
        run: node --test test/ui-utils.test.js
      - name: Tester le build
        run: node --test test/build.test.js
      - name: Tester les parcours navigateur
        run: node --test test/ui.test.js
      - name: Publier les captures visuelles desktop et mobile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: onnet-visual-${{ github.run_number }}
          path: artifacts/visual/*.png
          if-no-files-found: warn
          retention-days: 7
