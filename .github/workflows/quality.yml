name: Vérifications

on:
  pull_request:
  push:
    branches: [main, migration/publicodes-urssaf]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Installer Playwright
        run: |
          npm install --no-save --no-package-lock --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=120000 playwright@1.55.1
          # Les dépendances runtime sont fournies par l'image Ubuntu du runner ; éviter apt-get et ses miroirs réseau.
          npx --no-install playwright install chromium
      - name: Vérifier la syntaxe JavaScript
        run: |
          node --check src/urssaf-api-client.mjs
          node --check src/ui-utils.js
          node --check src/app.js
          node --check scripts/build.js
      # Le build synthétique reste hors du dépôt : les tests de calcul doivent lire l'artefact livré.
      - name: Construire le HTML autonome
        run: node scripts/build.js 999.999.999 "$RUNNER_TEMP/Onnet-999.999.999.html"
      - name: Tester le client API Urssaf (moteur de production)
        run: npm run test:urssaf-api
      - name: Tester le modèle Publicodes (diagnostics uniquement)
        run: npm run test:publicodes
      - name: Tester les anciens scénarios locaux (non utilisés en production)
        run: node --test test/calc.test.js
      - name: Tester le build
        run: node --test test/build.test.js
      - name: Tester les parcours navigateur
        run: node --test test/ui.test.js
      - name: Publier les captures visuelles desktop et mobile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: onnet-visual-${{ github.run_number }}
          path: artifacts/visual/*.png
          if-no-files-found: warn
          retention-days: 7
