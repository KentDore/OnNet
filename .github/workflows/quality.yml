name: Vérifications

on:
  pull_request:
  push:
    branches: [main, migration/publicodes-urssaf]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Calculer la prochaine version SemVer
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git fetch origin "$BASE_REF"
          BASE_VERSION="$(git show "origin/$BASE_REF:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          NEXT_VERSION="$(node scripts/next-version.js "$CURRENT_VERSION" "$BASE_VERSION" "$PR_TITLE" "$PR_BODY")"
          if [ "$NEXT_VERSION" != "$CURRENT_VERSION" ]; then
            echo "Version automatique : $CURRENT_VERSION -> $NEXT_VERSION"
            npm version "$NEXT_VERSION" --no-git-tag-version --ignore-scripts
          else
            echo "La version de la branche est déjà supérieure à celle de la base ; aucune incrémentation supplémentaire."
          fi
      - name: Lire et valider la version
        id: meta
        run: |
          VERSION="$(node -e "const p=require('./package.json'); if(typeof p.version !== 'string' || !/^\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?$/.test(p.version)) process.exit(1); process.stdout.write(p.version)")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Générer le lockfile complet
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Installer les dépendances verrouillées
        run: npm ci --no-audit --no-fund
      - name: Installer Chromium pour Playwright
        run: ./node_modules/.bin/playwright install chromium
      - name: Générer les fichiers HTML depuis les sources
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          node scripts/build.js "$VERSION" "$RUNNER_TEMP/Onnet-$VERSION.html"
          cp "$RUNNER_TEMP/Onnet-$VERSION.html" index.html
          cp "$RUNNER_TEMP/Onnet-$VERSION.html" "Onnet-$VERSION.html"
      - name: Vérifier la syntaxe JavaScript
        run: |
          node --check src/urssaf-api-client.mjs
          node --check src/ui-utils.mjs
          node --check src/state-normalizers.mjs
          node --check src/urssaf-calculation.mjs
          node --check src/rate-limited-fetch.mjs
          node --check src/smic-reference.mjs
          node --check src/urssaf-calculation-cache.mjs
          node --check src/urssaf-session-state.mjs
          node --check src/persistence-codec.mjs
          node --check src/app/00-state-and-calculations.js
          node --check src/app/10-persistence.js
          node --check src/app/20-sharing.js
          node --check src/app/30-rendering.js
          node --check src/app/40-household-and-navigation.js
          node --check src/app/50-input-events.js
          node --check src/app/60-notifications-and-modals.js
          node --check src/app/70-optional-tools-and-startup.js
          node --check scripts/build.js
      - name: Contrôler la qualité JavaScript et CSS
        run: npm run lint
      # Le build synthétique reste hors du dépôt : les tests de calcul doivent lire l'artefact livré.
      - name: Construire le HTML autonome
        run: node scripts/build.js 999.999.999 "$RUNNER_TEMP/Onnet-999.999.999.html"
      - name: Tester le codec de sauvegarde locale
        run: node --test test/persistence-codec.test.mjs
      - name: Tester l'état de session Urssaf
        run: node --test test/urssaf-session-state.test.mjs
      - name: Tester le cache de calcul Urssaf
        run: node --test test/urssaf-calculation-cache.test.mjs
      - name: Tester le repère SMIC 35 h / 39 h
        run: node --test test/smic-reference.test.mjs
      - name: Tester la file réseau temporisée
        run: node --test test/rate-limited-fetch.test.mjs
      - name: Tester les adaptateurs de calcul Urssaf
        run: node --test test/urssaf-calculation.test.mjs
      - name: Tester le client API Urssaf (moteur de production)
        run: npm run test:urssaf-api
      - name: Tester le modèle Publicodes (diagnostics uniquement)
        run: npm run test:publicodes
      - name: Tester les anciens scénarios locaux (non utilisés en production)
        run: node --test test/calc.test.js
      - name: Tester les utilitaires de présentation
        run: node --test test/ui-utils.test.js
      - name: Tester le build
        run: node --test test/build.test.js
      - name: Tester les parcours navigateur
        run: node --test test/ui.test.js
      - name: Préparer le HTML et le lockfile validés
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/onnet-output"
          cp "$RUNNER_TEMP/Onnet-$VERSION.html" "$RUNNER_TEMP/onnet-output/Onnet-$VERSION.html"
          cp package.json "$RUNNER_TEMP/onnet-output/package.json"
          cp package-lock.json "$RUNNER_TEMP/onnet-output/package-lock.json"
      - name: Transmettre le HTML et le lockfile au job de synchronisation
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          name: onnet-html-${{ github.run_id }}
          path: ${{ runner.temp }}/onnet-output/*
          if-no-files-found: error
          retention-days: 1
      - name: Publier les captures visuelles desktop et mobile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: onnet-visual-${{ github.run_number }}
          path: artifacts/visual/*.png
          if-no-files-found: warn
          retention-days: 7

  sync-generated-html:
    name: Synchroniser les HTML validés
    needs: test
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    concurrency:
      group: onnet-html-sync-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      # Ce job n'exécute aucun script du dépôt : il ne fait que récupérer la branche,
      # télécharger l'artefact produit après succès des tests, puis le copier/committer.
      - name: Récupérer la branche de la PR
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Télécharger le HTML testé
        uses: actions/download-artifact@v8
        with:
          name: onnet-html-${{ github.run_id }}
          path: ${{ runner.temp }}/onnet-html
      - name: Vérifier la tête de branche et préparer les artefacts
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          CURRENT_SHA="$(git rev-parse HEAD)"
          if [ "$CURRENT_SHA" != "$PR_HEAD_SHA" ]; then
            echo "La branche a avancé depuis le lancement des tests ; une exécution plus récente synchronisera les artefacts."
            exit 0
          fi

          GENERATED_HTML="$RUNNER_TEMP/onnet-html/Onnet-$VERSION.html"
          GENERATED_PACKAGE="$RUNNER_TEMP/onnet-html/package.json"
          GENERATED_LOCK="$RUNNER_TEMP/onnet-html/package-lock.json"
          test -s "$GENERATED_HTML"
          test -s "$GENERATED_PACKAGE"
          test -s "$GENERATED_LOCK"
          cp "$GENERATED_HTML" index.html
          cp "$GENERATED_HTML" "Onnet-$VERSION.html"
          cp "$GENERATED_PACKAGE" package.json
          cp "$GENERATED_LOCK" package-lock.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html "Onnet-$VERSION.html" package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Les HTML sont déjà synchronisés."
            exit 0
          fi

          git commit -m "build: synchroniser HTML générés et lockfile"
          git push origin "HEAD:refs/heads/$PR_BRANCH"
