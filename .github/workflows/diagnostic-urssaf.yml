name: Diagnostic API Urssaf (validation production)
# Le diagnostic navigateur du simulateur officiel peut être déclenché par [probe-simulator].

on:
  workflow_dispatch:
  push:
    branches: [migration/publicodes-urssaf-final, fix/clarify-mutuelle-deduction]

concurrency:
  group: onnet-urssaf-production-diagnostic
  cancel-in-progress: false

jobs:
  probe-meal-ticket-units:
    if: contains(github.event.head_commit.message, '[probe-meal-ticket-units]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tester les unités des titres-restaurant sur l'API réelle
        run: node scripts/probe-meal-ticket-units.mjs
      - name: Archiver les sondes
        if: always() && hashFiles('urssaf-meal-ticket-unit-probes.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: urssaf-meal-ticket-unit-probes-${{ github.run_id }}
          path: urssaf-meal-ticket-unit-probes.json
          retention-days: 30

  compare:
    if: contains(github.event.head_commit.message, '[run-urssaf-matrix]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer les dépendances du projet
        run: npm install --no-save --no-package-lock --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=120000
      - name: Comparer l'API aux diagnostics Publicodes (non bloquant pour la production)
        run: npm run compare:urssaf-api

  smoke:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-urssaf-smoke]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer les dépendances du projet
        run: npm install --no-save --no-package-lock --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=120000
      - name: Vérifier les réponses réelles de l’API Urssaf
        run: node scripts/smoke-urssaf-api.mjs
      - name: Archiver les résultats chiffrés du smoke test
        if: always() && hashFiles('urssaf-smoke-results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: urssaf-smoke-${{ github.run_id }}
          path: urssaf-smoke-results.json
          if-no-files-found: error
          retention-days: 30

  probe-simulator:
    if: contains(github.event.head_commit.message, '[probe-simulator]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer les dépendances du projet
        run: npm install --no-save --no-package-lock --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=120000
      - name: Installer Playwright pour le simulateur officiel
        run: npm install --no-save --no-package-lock playwright@1.55.1
      - name: Installer Chromium
        run: npx playwright install chromium
      - name: Inspecter le simulateur web officiel (cas synthétique)
        run: node scripts/probe-official-simulator.mjs
