name: OnNet Security Guardian

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 2"

permissions:
  contents: read

concurrency:
  group: onnet-security-guardian-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: npm dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify the committed lockfile is up to date
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if [ -n "$(git status --porcelain -- package-lock.json)" ]; then
            echo "package-lock.json n'est pas synchronisé avec package.json ; le lockfile doit être mis à jour dans la branche."
            git status --short -- package-lock.json
            exit 1
          fi

      - name: Audit committed runtime and development dependencies
        run: npm audit --package-lock-only --audit-level=high

  codeql:
    name: CodeQL security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v4
