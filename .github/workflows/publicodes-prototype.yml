name: Urssaf API prototype

on:
  push:
    branches:
      - migration/publicodes-urssaf
      - migration/publicodes-urssaf-final
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/publicodes-adapter.mjs'
      - 'src/urssaf-api-client.mjs'
      - 'src/app.js'
      - 'src/template.html'
      - 'src/ui-utils.js'
      - 'scripts/build.js'
      - 'test/build.test.js'
      - 'test/calc.test.js'
      - 'test/ui.test.js'
      - 'scripts/build-publicodes.js'
      - 'scripts/publicodes-scenarios.mjs'
      - 'scripts/compare-urssaf-api.mjs'
      - 'scripts/diagnose-urssaf-meal-tickets.mjs'
      - 'scripts/diagnose-overtime-50.mjs'
      - 'scripts/smoke-urssaf-api.mjs'
      - 'prototype/**'
      - 'test/publicodes.test.js'
      - 'test/urssaf-api-client.test.mjs'
      - '.github/workflows/publicodes-prototype.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/publicodes-adapter.mjs'
      - 'src/urssaf-api-client.mjs'
      - 'src/app.js'
      - 'src/template.html'
      - 'src/ui-utils.js'
      - 'scripts/build.js'
      - 'scripts/build-publicodes.js'
      - 'prototype/**'
      - 'test/publicodes.test.js'
      - 'test/urssaf-api-client.test.mjs'
      - '.github/workflows/publicodes-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validation locale (sans dépendance à l'API distante)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Resolve dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test adapters and API client
        run: npm run test:prototype
      - name: Print reproducible salary scenarios
        run: npm run scenarios:publicodes
      - name: Build standalone HTML prototype
        run: npm run build:publicodes
      - name: Check generated prototype
        run: |
          test -s dist/Onnet-publicodes-prototype.html
          ! grep -q 'PUBLICODES_BUNDLE' dist/Onnet-publicodes-prototype.html
          grep -q 'OnNetUrssafApi' dist/Onnet-publicodes-prototype.html
          grep -q 'mon-entreprise.urssaf.fr/api/v1/evaluate' dist/Onnet-publicodes-prototype.html
      - name: Upload standalone prototype
        uses: actions/upload-artifact@v7
        with:
          name: onnet-urssaf-api-prototype
          path: dist/Onnet-publicodes-prototype.html
          if-no-files-found: error
          retention-days: 14

  live-api:
    name: Vérifications réelles auprès de l'API Urssaf (manuelles)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/migration/publicodes-urssaf-final') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'migration/publicodes-urssaf-final')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Resolve dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Compare with the official Urssaf API
        run: npm run compare:urssaf-api
      - name: Diagnose meal tickets with the official API
        run: npm run diagnose:urssaf-meal-tickets
      - name: Verify 50% overtime premium with the official API
        run: node scripts/diagnose-overtime-50.mjs
      - name: Run production API smoke tests (including meal-ticket ceiling)
        run: node scripts/smoke-urssaf-api.mjs
